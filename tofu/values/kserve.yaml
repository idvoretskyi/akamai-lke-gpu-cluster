kserve:
  # The 1Gi default is OOM-killed downloading multi-GB Hugging Face checkpoints.
  storage:
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 4Gi
  controller:
    # Plain Deployments/Services/HPAs; no Knative or Istio.
    deploymentMode: Standard
    nodeSelector:
      nodepool.lke/role: system
    gateway:
      # InferenceService hostnames are <name>-<namespace>.<domain>.
      domain: kserve.local
      ingressGateway:
        # The chart creates Gateway "kserve-ingress-gateway" (class "envoy").
        enableGatewayApi: true
        createGateway: true
        kserveGateway: kserve/kserve-ingress-gateway
