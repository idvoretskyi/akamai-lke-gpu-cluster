# The operator controller runs on the system pool; the GPU operands (device
# plugin, GFD, DCGM, ...) tolerate the GPU pool's taint and land on the GPU node.
operator:
  nodeSelector:
    nodepool.lke/role: system

daemonsets:
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule

# LKE GPU nodes ship the NVIDIA driver, container toolkit and a containerd
# "nvidia" runtime. Letting the operator install the toolkit rewrites
# containerd's config and leaves the node NotReady.
driver:
  enabled: false
toolkit:
  enabled: false

devicePlugin:
  enabled: true
dcgmExporter:
  enabled: true
gfd:
  enabled: true
nodeStatusExporter:
  enabled: true
migManager:
  enabled: false # MIG is not supported on the RTX 4000 Ada

# The plugin validator only checks that nvidia.com/gpu is advertised. With
# WITH_WORKLOAD=true it also launches a pod that claims a GPU, which can never
# run once the model server holds the node's only GPU, so it retries forever.
validator:
  plugin:
    env:
      - name: WITH_WORKLOAD
        value: "false"
