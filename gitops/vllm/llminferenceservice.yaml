# Qwen3-8B (FP8) served by KServe's LLMInferenceService: upstream vLLM in the
# llm-d image, on the GPU pool. Synced by the Argo CD Application "vllm" (see
# helm_release.applications in tofu/platform.tf).
#
# Sizing for one RTX 4000 Ada (20 GB): ~8.8 GB of FP8 weights, the rest of the
# 90% vLLM budget goes to the KV cache, enough for a 32k-token context.
#
# Reachable through the Gateway at /<namespace>/<name>/v1/... (scripts/chat.sh).
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: qwen3
spec:
  model:
    # Downloaded by KServe's storage initializer before vLLM starts.
    uri: hf://Qwen/Qwen3-8B-FP8
    name: qwen3
  # One GPU, one replica. A rolling update would need a second GPU, so the old
  # pod must go before the new one starts.
  replicas: 1
  rolloutStrategy:
    maxSurge: 0
    maxUnavailable: 1
  # One replica needs no llm-d endpoint-picker scheduler: the route goes
  # straight to the Service. Add `scheduler: {}` once there are several GPUs.
  router:
    route: {}
  template:
    # GPU pool only; tolerate the GPU pool's taint.
    nodeSelector:
      nodepool.lke/role: gpu
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
    containers:
      - name: main
        env:
          # The llm-d image is RHEL-based and Triton looks for libcuda in
          # /usr/lib64; the NVIDIA toolkit mounts it here instead.
          - name: TRITON_LIBCUDA_PATH
            value: /usr/lib/x86_64-linux-gnu
          - name: VLLM_ADDITIONAL_ARGS
            value: --max-model-len=32768 --gpu-memory-utilization=0.90
        resources:
          requests:
            cpu: "2"
            memory: 8Gi
            nvidia.com/gpu: "1"
          limits:
            cpu: "3"
            memory: 12Gi
            nvidia.com/gpu: "1"
        # First start pulls the image and weights (~10 min): allow 20.
        startupProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTP
          failureThreshold: 120
          periodSeconds: 10
