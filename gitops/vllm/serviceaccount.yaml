# Lets KServe's storage initializer read the weights bucket. The Secret
# model-s3 (access key, annotated with the S3 endpoint) is created by OpenTofu
# in tofu/platform.tf from model_s3_access_key / model_s3_secret_key.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: model
secrets:
  - name: model-s3
