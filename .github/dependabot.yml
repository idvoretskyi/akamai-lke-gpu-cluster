version: 2
updates:
  # Keep Terraform/OpenTofu providers up-to-date for the root module and
  # every module under tofu/modules/* (directories: supports globs, so new
  # modules are picked up automatically — no dependabot.yml edit needed).
  - package-ecosystem: "terraform"
    directories:
      - "/tofu"
      - "/tofu/modules/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(terraform)"
    labels:
      - dependencies
    groups:
      terraform-providers:
        patterns:
          - "*"

  # Keep GitHub Actions up-to-date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(actions)"
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"
