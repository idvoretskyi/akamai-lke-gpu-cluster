name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  tofu-validate:
    name: OpenTofu validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: latest

      - name: Format check
        run: |
          cd tofu
          tofu fmt -check -recursive

      - name: Init root (no backend)
        run: |
          cd tofu
          tofu init -backend=false

      - name: Validate root configuration
        run: |
          cd tofu
          tofu validate -no-color

  tofu-validate-modules:
    name: OpenTofu validate modules
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - gpu-operator
          - metrics-server
          - kube-prometheus-stack

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: latest

      - name: Init module (${{ matrix.module }})
        run: |
          cd tofu/modules/${{ matrix.module }}
          tofu init -backend=false

      - name: Validate module (${{ matrix.module }})
        run: |
          cd tofu/modules/${{ matrix.module }}
          tofu validate -no-color
