name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write  # required for Trivy SARIF upload to GitHub Security tab

jobs:
  tofu-validate:
    name: OpenTofu validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.13.1"

      - name: Format check
        run: |
          cd tofu
          tofu fmt -check -recursive

      - name: Init root (no backend)
        run: |
          cd tofu
          tofu init -backend=false

      - name: Validate root configuration
        run: |
          cd tofu
          tofu validate -no-color

  tofu-validate-modules:
    name: OpenTofu validate modules
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - argo-cd
          - cert-manager
          - envoy-gateway
          - gpu-operator
          - kserve
          - kube-prometheus-stack
          - metrics-server

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.13.1"

      - name: Init module (${{ matrix.module }})
        run: |
          cd tofu/modules/${{ matrix.module }}
          tofu init -backend=false

      - name: Validate module (${{ matrix.module }})
        run: |
          cd tofu/modules/${{ matrix.module }}
          tofu validate -no-color

  tflint:
    name: tflint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.64.0

      - name: Init tflint
        run: |
          cd tofu
          tflint --init

      - name: Run tflint
        run: |
          cd tofu
          tflint --recursive --config "$(pwd)/.tflint.hcl"

  trivy:
    name: Trivy config scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # One scan: writes SARIF and fails the job on HIGH/CRITICAL findings.
      - name: Run Trivy IaC scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: tofu
          version: v0.75.0
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-results.sarif
          limit-severities-for-sarif: "true"
          exit-code: "1"

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-iac

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    strategy:
      matrix:
        scandir:
          - tofu/scripts

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run ShellCheck (${{ matrix.scandir }})
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ${{ matrix.scandir }}

  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: |
            **/*.md
            !**/.terraform/**

  examples:
    name: Examples lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: yamllint manifests
        run: |
          pip install --quiet yamllint
          yamllint -d '{extends: relaxed, rules: {line-length: disable}}' \
            examples/*/*.yaml

      - name: Compile Python
        run: |
          shopt -s nullglob
          files=(examples/*/*.py)
          [ ${#files[@]} -eq 0 ] || python -m py_compile "${files[@]}"

      - name: Check JSON
        run: |
          for f in examples/*/*.json; do
            [ -e "$f" ] || continue
            jq empty "$f"
          done

      - name: Dry-run Makefiles
        run: |
          for d in examples/*/; do
            echo "== $d"
            make -n -C "$d" -f Makefile $(sed -n 's/^\.PHONY: *//p' "$d/Makefile")
          done

  gitops:
    name: GitOps manifests and local charts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.19.0

      - name: yamllint gitops/
        run: |
          pip install --quiet yamllint
          yamllint -d '{extends: relaxed, rules: {line-length: disable}}' gitops/

      - name: Build every Kustomize directory
        run: |
          for k in $(find gitops -name kustomization.yaml); do
            d=$(dirname "$k")
            echo "== $d"
            kubectl kustomize "$d" > /dev/null
          done

      - name: Lint and render local Helm charts
        run: |
          for c in tofu/modules/*/chart; do
            echo "== $c"
            helm lint "$c"
            helm template ci "$c" > /dev/null
          done
