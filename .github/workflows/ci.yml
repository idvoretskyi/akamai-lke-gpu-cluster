name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write  # required for Trivy SARIF upload to GitHub Security tab

jobs:
  tofu-validate:
    name: OpenTofu validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: latest

      - name: Format check
        run: |
          cd tofu
          tofu fmt -check -recursive

      - name: Init root (no backend)
        run: |
          cd tofu
          tofu init -backend=false

      - name: Validate root configuration
        run: |
          cd tofu
          tofu validate -no-color

  tofu-validate-modules:
    name: OpenTofu validate modules
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - gpu-operator
          - metrics-server
          - kube-prometheus-stack
          - opencost

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: latest

      - name: Init module (${{ matrix.module }})
        run: |
          cd tofu/modules/${{ matrix.module }}
          tofu init -backend=false

      - name: Validate module (${{ matrix.module }})
        run: |
          cd tofu/modules/${{ matrix.module }}
          tofu validate -no-color

  tflint:
    name: tflint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest

      - name: Init tflint
        run: |
          cd tofu
          tflint --init

      - name: Run tflint
        run: |
          cd tofu
          tflint --recursive

  trivy:
    name: Trivy config scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Trivy IaC scan (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: tofu
          version: v0.70.0
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-results.sarif
          limit-severities-for-sarif: "true"
          exit-code: "0"

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-iac

      - name: Run Trivy IaC scan (table, fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: tofu
          version: v0.70.0
          severity: HIGH,CRITICAL
          format: table
          exit-code: "1"

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: tofu/scripts

  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          globs: |
            **/*.md
            !**/.terraform/**
